<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Web記事要約ツール</title>
  <link rel="stylesheet" href="{{ url_for('.static', filename='base.css') }}">
  <link rel="stylesheet" href="{{ url_for('.static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Web記事要約ツール</h1>
  <p>URLを入力するだけで 3行・5行・SNS用の要約を自動生成します</p>
</header>

<div class="container">
  <div class="input-box">
    <h2>記事URLを入力</h2>
    <div class="url-row">
      <input type="url" id="url-input" placeholder="https://example.com/article" autofocus>
      <button class="btn" id="summarize-btn" onclick="doSummarize()">要約する</button>
    </div>
    <div class="progress" id="progress">AIが記事を読んで要約中です… 少しお待ちください</div>
    <div class="error-box" id="error-box"></div>
  </div>

  <div class="input-box">
    <h2>キーワードで記事を検索</h2>
    <div class="url-row">
      <input type="text" id="search-input" placeholder="調べたいキーワードを入力">
      <button class="btn" id="search-btn" onclick="doSearch()">検索する</button>
    </div>
    <div class="progress" id="search-progress">検索中です… 少しお待ちください</div>
    <div class="error-box" id="search-error-box"></div>
    <ul class="search-results" id="search-results"></ul>
  </div>

  <div class="results" id="results">
    <div class="article-title" id="article-title"></div>
    <div class="article-url"   id="article-url"></div>
    <div class="result-actions">
      <button class="btn-secondary" onclick="downloadSummary()">💾 要約をダウンロード</button>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-label label-3">3行要約</span><button class="copy-btn" onclick="copyText('list-3')">コピー</button></div>
      <ul class="summary-list" id="list-3"></ul>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-label label-5">5行要約</span><button class="copy-btn" onclick="copyText('list-5')">コピー</button></div>
      <ul class="summary-list" id="list-5"></ul>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-label label-sns">SNS投稿用</span><button class="copy-btn" onclick="copyText('sns-text')">コピー</button></div>
      <div class="sns-text" id="sns-text"></div>
    </div>
  </div>
</div>

<script src="{{ url_for('.static', filename='app.js') }}"></script>
</body>
</html>
