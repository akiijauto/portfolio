# ブラウザ実行テスト用のリバースプロキシ。
# 全サービスを同一オリジン配下にぶら下げることでCORS設定を不要にしている
# （計測対象のサーバにCORSヘッダ処理を足すと、その分だけ性能比較が歪むため）。
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/py/   { proxy_pass http://bench-py:8000/; }
    location /api/go/   { proxy_pass http://bench-go:8000/; }
    location /api/rb/   { proxy_pass http://bench-rb:8000/; }
    location /api/ts/   { proxy_pass http://bench-ts:8000/; }
    location /api/java/ { proxy_pass http://bench-java:8000/; }
    location /api/cs/   { proxy_pass http://bench-cs:8000/; }
    location /api/php/  { proxy_pass http://bench-php:8000/; }
    location /api/rs/   { proxy_pass http://bench-rs:8000/; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
