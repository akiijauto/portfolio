{% extends "base.html" %}
{% block title %}新規登録 - メモアプリ{% endblock %}
{% block container_class %} narrow{% endblock %}

{% block content %}
<div class="box">
  <h2>新規登録</h2>
  <form method="post" action="{{ url_for('.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">パスワード（8文字以上）</label>
      <input type="password" id="password" name="password" required minlength="8">
    </div>
    <div class="field">
      <label for="password_confirm">パスワード（確認用）</label>
      <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary btn-block">登録する</button>
  </form>
  <div class="auth-links">
    既にアカウントをお持ちの方は <a href="{{ url_for('.login') }}">ログイン</a>
  </div>
</div>
{% endblock %}
